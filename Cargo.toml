[package]
name = "herdr-lineup"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Agent status, context, quota, and repository ship times for the Herdr sidebar"
repository = "https://github.com/fujimogn/herdr-lineup"
readme = "README.md"
keywords = ["herdr", "plugin", "sidebar", "agents", "usage"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
zstd = { version = "0.13", default-features = false }

[dev-dependencies]
tempfile = { version = "3", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
