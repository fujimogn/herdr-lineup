name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned toolchain
        id: rust
        run: |
          python3 -c 'import tomllib; print("channel=" + tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])' >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
      - name: Check version consistency
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: scripts/check-version.sh "$RELEASE_REF"
      - name: Release build
        run: cargo build --release --locked
      - name: Check binary dependency licenses
        run: python3 scripts/generate-third-party-licenses.py --check
      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          platform=$(uname -s)
          arch=$(uname -m)
          case "$platform:$arch" in
            Linux:x86_64) platform=linux ;;
            Linux:aarch64|Linux:arm64) platform=linux; arch=arm64 ;;
            Darwin:x86_64) platform=macos ;;
            Darwin:arm64) platform=macos ;;
            *) echo "unsupported runner: $platform/$arch" >&2; exit 1 ;;
          esac
          artifact="herdr-lineup-${GITHUB_REF_NAME}-${platform}-${arch}.tar.gz"
          mkdir -p dist
          tar -czf "dist/${artifact}" -C target/release herdr-lineup -C ../.. LICENSE NOTICE.md THIRD-PARTY-LICENSES.md README.md
          (cd dist && shasum -a 256 "${artifact}" > "SHA256SUMS-${platform}-${arch}.txt")
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.os }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: artifact-*
          path: dist/
          merge-multiple: true
      - name: Assemble checksums and release notes
        run: |
          cat dist/SHA256SUMS-*.txt > dist/SHA256SUMS.txt
          rm dist/SHA256SUMS-*.txt
          version="${GITHUB_REF_NAME#v}"
          scripts/extract-release-notes.sh "$version" > RELEASE_NOTES.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          --title "${GITHUB_REF_NAME}"
          --notes-file RELEASE_NOTES.md
          dist/*
