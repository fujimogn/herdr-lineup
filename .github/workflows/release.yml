name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Verify release tag
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Check main, CI, and release date
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/check-release-gate.sh "$GITHUB_REF_NAME"
      # check-release-version requires the tagged commit to be on a local main branch.
      - name: Check version consistency
        run: |
          git update-ref refs/heads/main refs/remotes/origin/main
          .develop-tools/resolve ci check-release-version

  build:
    name: Build (${{ matrix.os }})
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Read pinned toolchain
        id: rust
        run: |
          python3 -c 'import tomllib; print("channel=" + tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])' >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
      - name: Test
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
      - name: Check binary dependency licenses
        run: python3 scripts/generate-third-party-licenses.py --check
      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          platform=$(uname -s)
          arch=$(uname -m)
          case "$platform:$arch" in
            Linux:x86_64) platform=linux ;;
            Linux:aarch64|Linux:arm64) platform=linux; arch=arm64 ;;
            Darwin:x86_64) platform=macos ;;
            Darwin:arm64) platform=macos ;;
            *) echo "unsupported runner: $platform/$arch" >&2; exit 1 ;;
          esac
          artifact="herdr-lineup-${GITHUB_REF_NAME}-${platform}-${arch}.tar.gz"
          mkdir -p dist
          tar -czf "dist/${artifact}" -C target/release herdr-lineup -C ../.. LICENSE NOTICE.md THIRD-PARTY-LICENSES.md README.md
          (cd dist && shasum -a 256 "${artifact}" > "SHA256SUMS-${platform}-${arch}.txt")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: artifact-${{ matrix.os }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: artifact-*
          path: dist/
          merge-multiple: true
      - name: Assemble checksums and release notes
        run: |
          cat dist/SHA256SUMS-*.txt > dist/SHA256SUMS.txt
          rm dist/SHA256SUMS-*.txt
          version="${GITHUB_REF_NAME#v}"
          scripts/extract-release-notes.sh "$version" > RELEASE_NOTES.md
      - name: Publish GitHub Release if absent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "${GITHUB_REF_NAME} already exists; keeping its notes and assets"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file RELEASE_NOTES.md \
              dist/*
          fi
