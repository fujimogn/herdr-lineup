name: platform check

# Check every OS that `.develop-tools.json` declares in `platforms` before a release.
# `release check` dispatches this workflow and `release <bump>` reads its `platform (<os>)` jobs.
# The OS list and the runners live only in the shared workflow; this copy names neither.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    uses: fujimogn/develop-tools-action/.github/workflows/platform-check.yml@d9b4fcce621e2e22862bd0d9b696c8b67f170ce7 # v0.3.2
