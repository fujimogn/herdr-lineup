name: platform check

# Check every OS that `.config/develop-tools.json` declares in `platforms` before a release.
# `release check` dispatches this workflow and `release <bump>` reads its `platform (<os>)` jobs.
# The OS list and the runners live only in the shared workflow; this copy names neither.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    uses: fujimogn/develop-tools-action/.github/workflows/platform-check.yml@e5308ce03abf2d4d5e9eee4511d8541ad266c51b # v0.3.5
